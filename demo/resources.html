<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资料中心 - 云工智上</title>
  <link rel="icon" href="assets/icons/logo-mark.svg" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div id="data-source-banner" class="data-source-banner"></div>
  <div id="site-header"></div>

  <div id="breadcrumb-mount"></div>

  <div class="hero hero-compact">
    <div class="container hero-inner">
      <div class="hero-eyebrow">资料中心</div>
      <h1>产品说明书、安装指南与认证证书下载</h1>
      <p>资料来自各产品详情页挂载的技术文档，随产品数据自动同步更新。</p>
    </div>
  </div>

  <main class="container" style="padding-bottom:64px;">
    <section class="section" style="padding-top:20px;">
      <div class="resource-filter-bar" id="resource-filter-bar">
        <button type="button" class="is-active" data-filter="all">全部资料</button>
        <button type="button" data-filter="pdf">PDF 文档</button>
      </div>

      <div class="resource-list">
        <ul class="doc-list" id="resource-doc-list"></ul>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/quote-cart.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/resources-page.js"></script>
</body>
</html>
